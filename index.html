<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sintrense Sub-12</title>

<link rel="icon" href="logo.ico">
<meta name="theme-color" content="#0057B8">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
    padding-bottom:30px;
}

header{
    background:linear-gradient(135deg,#0057B8,#003B7A);
    color:white;
    text-align:center;
    padding:25px;
    border-bottom:6px solid #FFD100;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    padding:8px;
    margin-bottom:10px;
}

h1{
    font-size:30px;
}

.atualizacao{
    margin-top:10px;
    opacity:.9;
}

.container{
    max-width:750px;
    margin:auto;
    padding:15px;
}

.card{
    border-radius:25px;
    margin-bottom:20px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.card-header{
    padding:20px;
    text-align:center;
    color:white;
}

.a{
    background:linear-gradient(135deg,#0057B8,#003B7A);
}

.b{
    background:linear-gradient(135deg,#FFD100,#F4B400);
    color:#003B7A;
}

.equipa{
    font-size:28px;
    font-weight:bold;
}

.posicao{
    margin-top:10px;
}

.posicao .numero{
    font-size:90px;
    font-weight:bold;
    line-height:1;
}

.posicao .texto{
    font-size:18px;
    letter-spacing:4px;
}

.card-body{
    background:white;
    padding:20px;
}

.proximo{
    background:#FFF9D6;
    padding:18px;
    border-radius:18px;
    text-align:center;
    margin-bottom:15px;
}

.proximo h3{
    margin-bottom:15px;
    color:#003B7A;
}

.jogo{
    font-size:24px;
    font-weight:bold;
    line-height:1.5;
}

.hora{
    font-size:32px;
    color:#0057B8;
    margin-top:10px;
    font-weight:bold;
}

.contagem{
    text-align:center;
    background:#EDF6FF;
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
}

.contagem strong{
    font-size:26px;
}

.resultado{
    background:#28A745;
    color:white;
    padding:15px;
    border-radius:18px;
    text-align:center;
    margin-bottom:15px;
}

.resultado h3{
    margin-bottom:8px;
}

.resultado-texto{
    font-size:20px;
    font-weight:bold;
}

.stats{
    background:#f8f8f8;
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
}

.stats h3{
    margin-bottom:10px;
    color:#0057B8;
}

.linha{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid #e4e4e4;
}

.top5{
    background:#f8f8f8;
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
}

.top5 h3{
    margin-bottom:12px;
}

.top-item{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #e4e4e4;
}

.proximos{
    background:#f8f8f8;
    padding:15px;
    border-radius:18px;
}

.proximos h3{
    margin-bottom:12px;
}

.proximo-item{
    padding:10px;
    background:white;
    border-radius:12px;
    margin-top:8px;
}

.btn{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#0057B8;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
}

</style>
</head>

<body>

<header>

<img src="logo.ico" class="logo">

<h1>⚽ SINTRENSE SUB-12</h1>

<div class="atualizacao">
Atualizado: <strong id="atualizacao">...</strong>
</div>

</header>

<div class="container">

<div id="conteudo"></div>

</div>

<div class="footer">
Sport União Sintrense
</div>

<script>

async function carregarDados(){

    const r = await fetch("dados.json");
    const dados = await r.json();

    document.getElementById("atualizacao").innerText =
        dados.ultimaAtualizacao;

    criarCard(
        dados.sintrenseA,
        "🔵 EQUIPA A",
        "a",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-8-2026-2027/226443"
    );

    criarCard(
        dados.sintrenseB,
        "🟡 EQUIPA B",
        "b",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-9-2026-2027/226134"
    );

}

function criarCard(d,nome,classe,zerozero){

let html = `
<div class="card">

<div class="card-header ${classe}">
<div class="equipa">${nome}</div>

<div class="posicao">
<div class="numero">${d.posicao}</div>
<div class="texto">LUGAR</div>
</div>
</div>

<div class="card-body">

<div class="proximo">
<h3>📅 PRÓXIMO JOGO</h3>

<div class="jogo">
${d.proximoJogo.casa}
<br>VS<br>
${d.proximoJogo.fora}
</div>

<div class="hora">
${d.proximoJogo.hora}
</div>
</div>

<div class="resultado">
<h3>✅ Último Resultado</h3>
<div class="resultado-texto">
${d.ultimoResultado.casa}
${d.ultimoResultado.resultado}
${d.ultimoResultado.fora}
</div>
</div>

<div class="stats">
<h3>📊 Estatísticas</h3>

<div class="linha"><span>Pontos</span><strong>${d.pontos}</strong></div>
<div class="linha"><span>Jogos</span><strong>${d.jogos}</strong></div>
<div class="linha"><span>Vitórias</span><strong>${d.vitorias}</strong></div>
<div class="linha"><span>Empates</span><strong>${d.empates}</strong></div>
<div class="linha"><span>Derrotas</span><strong>${d.derrotas}</strong></div>
<div class="linha"><span>⚽ Marcados</span><strong>${d.golosMarcados}</strong></div>
<div class="linha"><span>🥅 Sofridos</span><strong>${d.golosSofridos}</strong></div>
<div class="linha"><span>➕ Diferença</span><strong>${d.diferenca}</strong></div>
</div>

<div class="top5">
<h3>🏆 TOP 5</h3>
`;

for(let t of d.top5){

html += `
<div class="top-item">
<span>${t.posicao}º ${t.equipa}</span>
<strong>${t.pontos}</strong>
</div>`;
}

html += `</div>

<div class="proximos">
<h3>📅 Próximos Jogos</h3>
`;

for(let j of d.proximosJogos){

html += `
<div class="proximo-item">
<strong>${j.data}</strong><br>
${j.casa}<br>
VS<br>
${j.fora}<br>
🕒 ${j.hora}
</div>`;
}

html += `
</div>

<a class="btn"
href="${zerozero}"
target="_blank">
🏆 Ver Classificação Completa no ZeroZero
</a>

</div>
</div>
`;

document.getElementById("conteudo").innerHTML += html;

}

carregarDados();

</script>

</body>
</html>
