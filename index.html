<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sintrense Sub-12</title>

<link rel="icon" href="logo.ico">
<meta name="theme-color" content="#0057B8">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0057B8,#003B7A);
    color:white;
    text-align:center;
    padding:25px 20px;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    padding:8px;
    margin-bottom:10px;
}

header h1{
    font-size:32px;
    margin-bottom:8px;
}

.update{
    opacity:.9;
}

.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:25px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.card-a{
    border-top:8px solid #0057B8;
}

.card-b{
    border-top:8px solid #FFD100;
}

.titulo{
    padding:20px;
    text-align:center;
    background:#fafafa;
}

.titulo h2{
    font-size:28px;
    margin-bottom:10px;
}

.posicao-label{
    color:#666;
    font-size:14px;
    letter-spacing:2px;
}

.posicao{
    font-size:90px;
    font-weight:bold;
    color:#0057B8;
    line-height:.9;
    margin-top:8px;
}

.conteudo{
    padding:20px;
}

.bloco{
    margin-bottom:18px;
}

.bloco-titulo{
    font-size:13px;
    font-weight:bold;
    color:#666;
    letter-spacing:1px;
    margin-bottom:10px;
}

.jogo{
    background:#fff9d8;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.equipa{
    font-size:24px;
    font-weight:bold;
}

.vs{
    margin:10px 0;
    color:#666;
    font-weight:bold;
}

.data{
    margin-top:15px;
    font-size:18px;
}

.hora{
    font-size:42px;
    color:#0057B8;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    background:#f8f8f8;
    border-radius:15px;
    padding:15px;
    text-align:center;
}

.stat-valor{
    font-size:30px;
    font-weight:bold;
    color:#0057B8;
}

.stat-label{
    font-size:11px;
    color:#666;
    margin-top:8px;
    line-height:1.3;
}

.resultado{
    color:white;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.resultado-estado{
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:15px;
}

.resultado-equipa{
    font-size:20px;
    font-weight:bold;
}

.resultado-score{
    font-size:56px;
    font-weight:bold;
    margin:12px 0;
}

.btn{
    display:block;
    text-decoration:none;
    text-align:center;
    background:#0057B8;
    color:white;
    font-weight:bold;
    padding:16px;
    border-radius:16px;
    margin-top:15px;
}

.footer{
    text-align:center;
    padding:25px;
    color:#666;
}

    @media(max-width:500px){

    .posicao{
        font-size:70px;
    }

    .equipa{
        font-size:20px;
    }

    .hora{
        font-size:34px;
    }

    .stats{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<header>

<img src="logo.ico" class="logo" alt="Sintrense">

<h1>SINTRENSE SUB-12</h1>

<div class="update">
Atualizado:
<strong id="atualizacao">...</strong>
</div>

</header>

<div class="container" id="conteudo"></div>

<div class="footer">
Sport União Sintrense
</div>

<script>

async function carregarDados(){

    const resposta = await fetch("dados.json");
    const dados = await resposta.json();

    document.getElementById("atualizacao").textContent =
    dados.ultimaAtualizacao;

    criarCard(
        dados.sintrenseA,
        "EQUIPA A",
        "card-a",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-8-2026-2027/226443"
    );

    criarCard(
        dados.sintrenseB,
        "EQUIPA B",
        "card-b",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-9-2026-2027/226134"
    );
}

function criarCard(d,nome,classe,link){

    let corResultado = "#6c757d";
    let textoResultado = "RESULTADO";

    try{

        const partes =
        d.ultimoResultado.resultado.split("-");

        const golosCasa =
        parseInt(partes[0]);

        const golosFora =
        parseInt(partes[1]);

        const sintrenseCasa =
        d.ultimoResultado.casa
        .includes("Sintrense");

        let golosSintrense;
        let golosAdversario;

        if(sintrenseCasa){

            golosSintrense = golosCasa;
            golosAdversario = golosFora;

        }else{

            golosSintrense = golosFora;
            golosAdversario = golosCasa;

        }

        if(golosSintrense > golosAdversario){

            corResultado = "#28A745";
            textoResultado = "VITÓRIA";

        }else if(golosSintrense < golosAdversario){

            corResultado = "#DC3545";
            textoResultado = "DERROTA";

        }else{

            corResultado = "#FFC107";
            textoResultado = "EMPATE";

        }

    }catch(e){}

    const html = `

    <div class="card ${classe}">

        <div class="titulo">

            <h2>${nome}</h2>

            <div class="posicao-label">
                CLASSIFICAÇÃO
            </div>

            <div class="posicao">
                ${d.posicao}º
            </div>

        </div>

        <div class="conteudo">

            <div class="bloco">

                <div class="bloco-titulo">
                    PRÓXIMO JOGO
                </div>

                <div class="jogo">

                    <div class="equipa">
                        ${d.proximoJogo.casa}
                    </div>

                    <div class="vs">VS</div>

                    <div class="equipa">
                        ${d.proximoJogo.fora}
                    </div>

                    <div class="data">
                        ${d.proximoJogo.data || ""}
                    </div>

                    <div class="hora">
                        ${d.proximoJogo.hora}
                    </div>

                </div>

            </div>

            <div class="bloco">

                <div class="bloco-titulo">
                    ESTATÍSTICAS
                </div>

                <div class="stats">

                    <div class="stat">
                        <div class="stat-valor">
                            ${d.golosMarcados}
                        </div>
                        <div class="stat-label">
                            GOLOS MARCADOS
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-valor">
                            ${d.golosSofridos}
                        </div>
                        <div class="stat-label">
                            GOLOS SOFRIDOS
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-valor">
                            ${d.diferenca}
                        </div>
                        <div class="stat-label">
                            DIFERENÇA
                        </div>
                    </div>

                </div>

            </div>

            <div class="bloco">

                <div class="bloco-titulo">
                    ÚLTIMO RESULTADO
                </div>

                <div
                    class="resultado"
                    style="background:${corResultado}">

                    <div class="resultado-estado">
                        ${textoResultado}
                    </div>

                    <div class="resultado-equipa">
                        ${d.ultimoResultado.casa}
                    </div>

                    <div class="resultado-score">
                        ${d.ultimoResultado.resultado}
                    </div>

                    <div class="resultado-equipa">
                        ${d.ultimoResultado.fora}
                    </div>

                </div>

            </div>

            <a
                href="${link}"
                target="_blank"
                class="btn">

                VER CLASSIFICAÇÃO COMPLETA NO ZEROZERO

            </a>

        </div>

    </div>
    `;

    document.getElementById("conteudo").innerHTML += html;
}

carregarDados();

</script>

</body>
</html>
