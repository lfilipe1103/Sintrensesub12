<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sintrense Sub-12</title>

<link rel="icon" href="logo.ico">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef2f7;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0057B8,#003B7A);
    color:white;
    text-align:center;
    padding:25px;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    padding:8px;
    margin-bottom:10px;
}

h1{
    font-size:30px;
}

.atualizacao{
    opacity:.9;
    margin-top:8px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:25px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.card-top{
    color:white;
    text-align:center;
    padding:20px;
}

.a{
    background:linear-gradient(135deg,#0057B8,#003B7A);
}

.b{
    background:linear-gradient(135deg,#FFD100,#F4B400);
    color:#003B7A;
}

.equipa{
    font-size:28px;
    font-weight:bold;
}

.pos{
    font-size:90px;
    font-weight:bold;
    line-height:.9;
    margin-top:10px;
}

.pos-label{
    letter-spacing:4px;
}

.card-body{
    padding:20px;
}

.proximo{
    background:#fff9d6;
    border-radius:18px;
    text-align:center;
    padding:20px;
    margin-bottom:15px;
}

.proximo h3{
    color:#003B7A;
    margin-bottom:15px;
}

.team{
    font-size:24px;
    font-weight:bold;
}

.vs{
    margin:10px 0;
    color:#666;
    font-weight:bold;
}

.data{
    font-size:18px;
    margin-top:10px;
}

.hora{
    font-size:36px;
    color:#0057B8;
    font-weight:bold;
}

.contagem{
    background:#edf6ff;
    border-radius:18px;
    padding:15px;
    text-align:center;
    margin-bottom:15px;
}

.count-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.count-box{
    background:white;
    border-radius:12px;
    padding:10px;
}

.count-value{
    font-size:26px;
    font-weight:bold;
}

.count-label{
    font-size:12px;
    color:#777;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#f4f8ff;
    border-radius:15px;
    padding:12px;
    text-align:center;
}

.stat-value{
    font-size:24px;
    font-weight:bold;
}

.resultado{
    background:#28A745;
    color:white;
    border-radius:18px;
    text-align:center;
    padding:15px;
    margin-bottom:15px;
}

.resultado h3{
    margin-bottom:10px;
}

.score{
    font-size:48px;
    font-weight:bold;
}

details{
    margin-bottom:10px;
    background:#f8f8f8;
    border-radius:15px;
    overflow:hidden;
}

summary{
    padding:15px;
    cursor:pointer;
    font-weight:bold;
}

.detail-content{
    padding:15px;
    background:white;
}

.top-item,
.jogo-item{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.btn{
    display:block;
    text-align:center;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:15px;
    background:#0057B8;
    margin-top:10px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
}

</style>
</head>

<body>

<header>

<img src="logo.ico" class="logo">

<h1>SINTRENSE SUB-12</h1>

<div class="atualizacao">
Atualizado:
<strong id="atualizacao">...</strong>
</div>

</header>

<div class="container" id="equipas"></div>

<div class="footer">
Sport União Sintrense
</div>

<script>

function criarCountdown(data,hora,id){

    if(!data){
        document.getElementById(id).innerHTML =
        "Sem data disponível";
        return;
    }

    const partes = data.split("/");

    const jogo = new Date(
        new Date().getFullYear(),
        Number(partes[1])-1,
        Number(partes[0]),
        Number(hora.split(":")[0]),
        Number(hora.split(":")[1]),
        0
    );

    function atualizar(){

        let diff = jogo - new Date();

        if(diff <= 0){
            document.getElementById(id).innerHTML =
            "⚽ EM JOGO";
            return;
        }

        const dias =
        Math.floor(diff/86400000);

        diff -= dias*86400000;

        const horas =
        Math.floor(diff/3600000);

        diff -= horas*3600000;

        const minutos =
        Math.floor(diff/60000);

        document.getElementById(id).innerHTML = `
        <div class="count-grid">
            <div class="count-box">
                <div class="count-value">${dias}</div>
                <div class="count-label">DIAS</div>
            </div>
            <div class="count-box">
                <div class="count-value">${horas}</div>
                <div class="count-label">HORAS</div>
            </div>
            <div class="count-box">
                <div class="count-value">${minutos}</div>
                <div class="count-label">MIN</div>
            </div>
        </div>`;
    }

    atualizar();
    setInterval(atualizar,60000);
}

async function carregar(){

    const r = await fetch("dados.json");
    const dados = await r.json();

    document.getElementById("atualizacao").textContent =
    dados.ultimaAtualizacao;

    criarCard(
        dados.sintrenseA,
        "EQUIPA A",
        "a",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-8-2026-2027/226443"
    );

    criarCard(
        dados.sintrenseB,
        "EQUIPA B",
        "b",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-9-2026-2027/226134"
    );
}

function criarCard(d,nome,classe,link){

const id = "count_" + Math.random().toString(36).substring(2);

let html = `

<div class="card">

<div class="card-top ${classe}">
<div class="equipa">${nome}</div>
<div class="pos">${d.posicao}º</div>
<div class="pos-label">LUGAR</div>
</div>

<div class="card-body">

<div class="proximo">

<h3>📅 PRÓXIMO JOGO</h3>

<div class="team">${d.proximoJogo.casa}</div>

<div class="vs">VS</div>

<div class="team">${d.proximoJogo.fora}</div>

<div class="data">${d.proximoJogo.data || ""}</div>

<div class="hora">${d.proximoJogo.hora}</div>

</div>

<div class="contagem">

⏳ FALTAM

<div id="${id}"></div>

</div>

<div class="stats">

<div class="stat">
<div class="stat-value">${d.golosMarcados}</div>
⚽
</div>

<div class="stat">
<div class="stat-value">${d.golosSofridos}</div>
🥅
</div>

<div class="stat">
<div class="stat-value">${d.diferenca}</div>
➕
</div>

<div class="stat">
<div class="stat-value">${d.pontos}</div>
🏆
</div>

</div>

<div class="resultado">

<h3>✅ ÚLTIMO RESULTADO</h3>

<div class="score">${d.ultimoResultado.resultado}</div>

<div>${d.ultimoResultado.casa}</div>
<div>${d.ultimoResultado.fora}</div>

</div>

<details>
<summary>🏆 Classificação (Top 5)</summary>

<div class="detail-content">
${d.top5.map(t=>`
<div class="top-item">
${t.posicao}º ${t.equipa}
<strong style="float:right">${t.pontos}</strong>
</div>`).join("")}
</div>
</details>

<details>
<summary>📅 Próximos Jogos</summary>

<div class="detail-content">
${d.proximosJogos.map(j=>`
<div class="jogo-item">
<strong>${j.data || "-"}</strong><br>
${j.casa}<br>
VS<br>
${j.fora}<br>
🕒 ${j.hora}
</div>`).join("")}
</div>

</details>

<a class="btn"
href="${link}"
target="_blank">
🏆 Ver Classificação Completa no ZeroZero
</a>

</div>
</div>
`;

document.getElementById("equipas").innerHTML += html;

setTimeout(() => {
    criarCountdown(
        d.proximoJogo.data,
        d.proximoJogo.hora,
        id
    );
},100);

}

carregar();

</script>

</body>
</html>
