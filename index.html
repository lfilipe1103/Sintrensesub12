<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sintrense Sub-12</title>

<link rel="icon" href="logo.ico">

<meta name="theme-color" content="#0057B8">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f5f9;
    color:#222;
}

header{
    background:#0057b8;
    color:white;
    text-align:center;
    padding:25px;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    padding:8px;
    margin-bottom:10px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

.update{
    opacity:.9;
}

#equipas{
    max-width:500px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:25px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.nome{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}

.posicao{
    text-align:center;
}

.posicao-num{
    font-size:80px;
    font-weight:bold;
    color:#0057b8;
    line-height:1;
}

.posicao-lugar{
    font-size:16px;
    letter-spacing:4px;
    margin-top:5px;
}

.jogo{
    margin-top:20px;
    text-align:center;
}

.team{
    font-size:24px;
    font-weight:bold;
}

.vs{
    margin:8px 0;
    color:#777;
}

.hora{
    font-size:32px;
    color:#0057b8;
    margin-top:10px;
    font-weight:bold;
}

.contagem{
    background:#eef5ff;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    text-align:center;
}

.contagem strong{
    font-size:24px;
    display:block;
    margin-top:8px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.stat{
    background:#eef5ff;
    border-radius:15px;
    padding:10px;
    text-align:center;
}

.valor{
    font-size:24px;
    font-weight:bold;
}

.resultado{
    background:#28a745;
    color:white;
    border-radius:15px;
    padding:15px;
    text-align:center;
    margin-top:15px;
}

.score{
    font-size:40px;
    font-weight:bold;
    margin:10px 0;
}

.btn{
    display:block;
    margin-top:15px;
    background:#0057b8;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:15px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
}

</style>
</head>

<body>

<header>

<img src="logo.ico" class="logo">

<h1>⚽ SINTRENSE SUB-12</h1>

<div class="update">
Atualizado:
<span id="atualizacao">...</span>
</div>

</header>

<div id="equipas"></div>

<div class="footer">
Sport União Sintrense
</div>

<script>

function criarContagem(dataStr,horaStr,id){

    if(!dataStr || !horaStr) return;

    const p = dataStr.split("/");

    const ano = new Date().getFullYear();

    const jogo = new Date(
        ano,
        parseInt(p[1])-1,
        parseInt(p[0]),
        parseInt(horaStr.split(":")[0]),
        parseInt(horaStr.split(":")[1]),
        0
    );

    function atualizar(){

        const agora = new Date();

        let diff = jogo - agora;

        if(diff <= 0){

            document.getElementById(id).innerHTML =
            "⚽ EM JOGO";
            return;
        }

        const dias =
        Math.floor(diff/(1000*60*60*24));

        diff -= dias*(1000*60*60*24);

        const horas =
        Math.floor(diff/(1000*60*60));

        diff -= horas*(1000*60*60);

        const minutos =
        Math.floor(diff/(1000*60));

        document.getElementById(id).innerHTML =
        `${dias}D ${horas}H ${minutos}M`;
    }

    atualizar();

    setInterval(atualizar,60000);
}

async function carregar(){

    const r = await fetch("dados.json");
    const d = await r.json();

    document.getElementById(
        "atualizacao"
    ).textContent =
    d.ultimaAtualizacao;

    criarCard(
        d.sintrenseA,
        "🔵 EQUIPA A",
        "serie8",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-8-2026-2027/226443"
    );

    criarCard(
        d.sintrenseB,
        "🟡 EQUIPA B",
        "serie9",
        "https://www.zerozero.pt/edicao/af-lisboa-fut7-juniores-d-s12-1-fase-serie-9-2026-2027/226134"
    );
}

function criarCard(d,nome,id,link){

    document.getElementById("equipas").innerHTML +=

    `<div class="card">

        <div class="nome">${nome}</div>

        <div class="posicao">

            <div class="posicao-num">
            ${d.posicao}º
            </div>

            <div class="posicao-lugar">
            LUGAR
            </div>

        </div>

        <div class="jogo">

            <div class="team">
            ${d.proximoJogo.casa}
            </div>

            <div class="vs">
            VS
            </div>

            <div class="team">
            ${d.proximoJogo.fora}
            </div>

            <div class="hora">
            ${d.proximoJogo.hora}
            </div>

        </div>

        <div class="contagem">

            ⏳ FALTAM

            <strong id="countdown-${id}">
            ...
            </strong>

        </div>

        <div class="stats">

            <div class="stat">
                <div class="valor">
                ${d.golosMarcados}
                </div>
                ⚽
            </div>

            <div class="stat">
                <div class="valor">
                ${d.golosSofridos}
                </div>
                🥅
            </div>

            <div class="stat">
                <div class="valor">
                ${d.diferenca}
                </div>
                ➕
            </div>

            <div class="stat">
                <div class="valor">
                ${d.pontos}
                </div>
                🏆
            </div>

        </div>

        <div class="resultado">

            ✅ Último Resultado

            <div class="score">
            ${d.ultimoResultado.resultado}
            </div>

            ${d.ultimoResultado.casa}
            <br>
            ${d.ultimoResultado.fora}

        </div>

        <a
            class="btn"
            href="${link}"
            target="_blank">

            🏆 Ver no ZeroZero

        </a>

    </div>`;

    criarContagem(
        d.proximoJogo.data,
        d.proximoJogo.hora,
        `countdown-${id}`
    );
}

carregar();

</script>

</body>
</html>
